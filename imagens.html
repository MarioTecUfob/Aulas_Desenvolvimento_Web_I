<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" href="favicon_html.png" type="image/svg+xml">
    <title>Tecnologias Web</title>
</head>
<body>
    <header>
        <h1>Tecnologias Web</h1>
        <p>Exemplos de imagens utilizadas em uma página HTML.</p>
    </header>
    <main>
        <section>
            <h2>HTML</h2>
            <p>Carregando uma imagem que está na mesma pasta do arquivo HTML.</p>
            <figure>
                <img src="logo_html_200.png" alt="Logotipo do HTML5">
                <figcaption>Logotipo do HTML5</figcaption>
            </figure>
        </section>
        <section>
            <h2>CSS</h2>
            <p>Carregando uma imagem que está dentro de uma subpasta.</p>
            <figure>
                <img src="imagens/logo_css200.png" alt="Logotipo do CSS3">
                <figcaption>Logotipo do CSS3</figcaption>
            </figure>
        </section>

        <section>
            <h2>JavaScript</h2>
            <p>Carregando uma imagem externa utilizando uma URL.</p>
            <figure>
                <img src="https://cdn-icons-png.magnific.com/256/1199/1199124.png?semt=ais_white_label"                   alt="Logotipo do JavaScript">

                <figcaption>Logotipo do JavaScript</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>Desenvolvimento Web I — 2026</p>
    </footer>
</body>
</html>
